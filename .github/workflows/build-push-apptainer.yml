name: Build and deploy Apptainer image

on:
  workflow_run:
    workflows: ["Build and deploy PyPI package"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and deploy container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    container:
      image: kaczmarj/apptainer:latest
      options: --privileged

    steps:
      - name: Install git
        run: |
          apk update
          apk add --no-cache git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag from history
        id: tag
        run: |
          if ! LATEST_TAG=$(git describe --tags --abbrev=0); then
            echo "::error::Latest tag not found in repository"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build SIF image
        run: |
          apptainer build bidscoin.sif apptainer.def

      - name: Login and deploy container
        run: |
          echo "${{ github.token }}" | apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push bidscoin.sif oras://ghcr.io/donders-institute/bidscoin:${{ steps.tag.outputs.LATEST_TAG }}
          apptainer push bidscoin.sif oras://ghcr.io/donders-institute/bidscoin:latest
